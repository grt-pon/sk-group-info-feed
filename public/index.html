<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKグループ 情報フィード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  :root { --accent: #4642A0; --accent-tint: #ece9f7; --bg: #f9f9fa; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif; background: var(--bg); color: #222; }
  a { color: #222; text-decoration: none; }
  a:hover { color: var(--accent); }
  button { font-family: inherit; cursor: pointer; }
  .layout { display: flex; align-items: stretch; min-height: 100vh; }
  .sidebar { width: 264px; flex-shrink: 0; background: #fdfdfe; border-right: 1px solid #e6e6e8; display: flex; flex-direction: column; padding: 28px 20px; gap: 22px; position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto; }
  .logo-row { display: flex; align-items: center; gap: 10px; }
  .logo-mark { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo-text { display: flex; flex-direction: column; line-height: 1.25; }
  .logo-text b { font-size: 17px; letter-spacing: 0.02em; }
  .logo-text span { font-size: 11px; color: #888; }
  .cat-list { display: flex; flex-direction: column; gap: 1px; }
  .cat-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: 8px; font-size: 14px; color: #333; background: none; border: none; width: 100%; text-align: left; }
  .cat-row:hover { background: #f1f0f8; }
  .cat-row.active { background: rgba(70,66,160,0.1); color: var(--accent); font-weight: 700; }
  .cat-row .count { font-size: 12px; color: #999; }
  .cat-row.active .count { color: var(--accent); }
  .main { flex: 1; padding: 32px 40px 64px; display: flex; justify-content: center; }
  .main-inner { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 30px; }
  .search-row { display: flex; gap: 10px; }
  .search-box { flex: 1; display: flex; align-items: center; gap: 8px; background: white; border: 1px solid #ddd; border-radius: 10px; padding: 10px 14px; }
  .search-box input { border: none; outline: none; font: inherit; font-size: 13.5px; width: 100%; }
  .status-line { font-size: 12.5px; color: #888; }
  .section-head { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid #e2e2e4; padding-bottom: 10px; }
  .section-head .num { font-size: 12px; font-weight: 700; color: var(--accent); margin-right: 10px; }
  .section-head h2 { display: inline; margin: 0; font-size: 17px; font-weight: 700; }
  .hero { display: flex; gap: 28px; align-items: flex-start; }
  .hero-icon { width: 230px; height: 150px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .hero-body { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
  .hero-body h3 { margin: 0; font-size: 24px; line-height: 1.45; font-weight: 700; color: #111; }
  .hero-body p { margin: 0; font-size: 14px; line-height: 1.85; color: #444; }
  .meta-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .meta-text { font-size: 12px; color: #777; }
  .actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .actions button { background: none; border: none; color: #888; padding: 4px; display: flex; align-items: center; gap: 3px; }
  .actions button:hover { color: var(--accent); }
  .reaction-count { font-size: 11px; font-weight: 700; min-width: 8px; }
  .pickup-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
  .pickup-card { background: white; border: 1px solid #e6e6e8; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .pickup-strip { height: 5px; }
  .pickup-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .pickup-body h4 { margin: 0; font-size: 14px; line-height: 1.5; font-weight: 700; color: #1c1c1c; }
  .pickup-body p { margin: 0; font-size: 12px; line-height: 1.6; color: #666; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .pickup-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 6px; font-size: 10.5px; color: #999; }
  .dense-list { display: flex; flex-direction: column; background: white; border: 1px solid #e6e6e8; border-radius: 14px; padding: 4px 18px; }
  .news-row { display: flex; align-items: stretch; gap: 14px; padding: 16px 0; border-bottom: 1px solid #efeff1; }
  .news-row:last-child { border-bottom: none; }
  .news-bar { width: 3px; align-self: stretch; border-radius: 2px; flex-shrink: 0; }
  .news-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .news-cat { font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; }
  .news-title { margin: 0; font-size: 14.5px; font-weight: 700; line-height: 1.45; color: #1c1c1c; }
  .news-summary { margin: 0; font-size: 12.5px; line-height: 1.6; color: #666; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .news-meta { display: flex; align-items: center; gap: 10px; font-size: 11px; color: #999; }
  .news-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; flex-shrink: 0; gap: 8px; }
  .mode-toggle { display: flex; background: #ececef; border-radius: 10px; padding: 3px; gap: 2px; }
  .mode-toggle button { flex: 1; border: none; background: transparent; color: #777; font-weight: 500; font-size: 13px; padding: 9px 6px; border-radius: 8px; }
  .mode-toggle button.active { background: white; color: #222; font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .cat-check-row { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; color: #555; }
  .cat-check-row.checked { background: rgba(70,66,160,0.08); color: #222; font-weight: 700; }
  .checkbox { width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid #d5d5d8; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .my-cat-header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; font-size: 12px; font-weight: 700; color: #666; }
  .my-cat-count { color: var(--accent); }
  .empty { color: #999; font-size: 13px; padding: 40px 0; text-align: center; }
  .clickable { cursor: pointer; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .hidden { display: none; }
  .modal-box { background: white; border-radius: 16px; max-width: 620px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 28px 30px; position: relative; }
  .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: #999; padding: 6px; }
  .modal-close:hover { color: var(--accent); }
  .modal-kicker { font-size: 12px; font-weight: 700; }
  .modal-box h3 { margin: 10px 0 14px; font-size: 20px; line-height: 1.5; }
  .modal-box p { font-size: 14.5px; line-height: 1.9; color: #333; white-space: pre-wrap; }
  .modal-meta { font-size: 12px; color: #888; margin-top: 18px; padding-top: 14px; border-top: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .modal-source-link { font-size: 13px; font-weight: 700; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 8px; padding: 8px 16px; white-space: nowrap; }
  .modal-source-link:hover { background: var(--accent); color: white; }

  .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 12px; border-top: 1px solid #eee; }
  .sidebar-footer-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; color: #777; font-size: 13px; padding: 9px 10px; border-radius: 8px; text-align: left; }
  .sidebar-footer-btn:hover { background: #f1f0f8; color: var(--accent); }

  .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .form-field label { font-size: 12.5px; font-weight: 700; color: #555; }
  .field-hint { font-weight: 400; color: #aaa; font-size: 11px; }
  .form-field input, .form-field textarea { font: inherit; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; resize: vertical; }
  .form-submit { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 11px 20px; font-size: 14px; font-weight: 700; }
  .form-submit:hover { background: #38346f; }
  .form-note { font-size: 12.5px; color: var(--accent); margin-top: 10px; }
  .fb-list-head { font-size: 12.5px; font-weight: 700; color: #666; margin: 22px 0 10px; padding-top: 16px; border-top: 1px solid #eee; }
  .fb-item { padding: 12px 0; border-bottom: 1px solid #efeff1; }
  .fb-item:last-child { border-bottom: none; }
  .fb-item-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: #999; margin-bottom: 4px; }
  .fb-item-content { font-size: 13.5px; line-height: 1.7; color: #333; white-space: pre-wrap; }
  .fb-reply { margin: 8px 0 0 16px; padding: 8px 10px; background: #f8f8fa; border-radius: 8px; }
  .fb-reply-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: #999; margin-bottom: 2px; }
  .fb-reply-content { font-size: 12.5px; line-height: 1.6; color: #444; white-space: pre-wrap; }
  .fb-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .fb-action-btn { background: none; border: none; font-size: 11px; color: #999; padding: 0; text-decoration: underline; }
  .fb-action-btn:hover { color: var(--accent); }
  .fb-action-btn.danger:hover { color: #c0392b; }
  .fb-reply-toggle { margin: 8px 0 0 16px; background: none; border: 1px solid #ddd; border-radius: 6px; padding: 5px 12px; font-size: 12px; color: #666; }
  .fb-reply-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .fb-reply-form, .fb-edit-form { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .fb-reply-form { margin-left: 16px; }
  .fb-reply-form input, .fb-reply-form textarea, .fb-edit-form input, .fb-edit-form textarea { font: inherit; font-size: 12.5px; border: 1px solid #ddd; border-radius: 6px; padding: 7px 10px; }
  .fb-reply-form .r-content, .fb-edit-form .e-content { flex: 1 1 100%; resize: vertical; }
  .fb-reply-form .r-dept, .fb-reply-form .r-name, .fb-edit-form .e-dept, .fb-edit-form .e-name { flex: 1 1 110px; }
  .fb-reply-form button, .fb-edit-form button { flex: 0 0 auto; background: #ececef; color: #555; border: none; border-radius: 6px; padding: 7px 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .fb-reply-form button:hover, .fb-edit-form button[type="submit"]:hover { background: var(--accent); color: white; }
  .fb-empty { font-size: 12.5px; color: #999; padding: 8px 0; }
  .cl-item { padding: 12px 0; border-bottom: 1px solid #efeff1; }
  .cl-item:last-child { border-bottom: none; }
  .cl-date { font-size: 11.5px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .cl-content { font-size: 13.5px; line-height: 1.7; color: #333; }
  .cl-content li { margin-bottom: 2px; }
  .confirm-box { max-width: 360px; padding: 26px 26px 22px; }
  .confirm-box p { margin: 0 0 20px; font-size: 14.5px; line-height: 1.7; color: #222; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .confirm-actions button { border-radius: 8px; padding: 9px 18px; font-size: 13.5px; font-weight: 700; border: none; }
  .confirm-cancel { background: #ececef; color: #555; }
  .confirm-ok { background: #c0392b; color: white; }
  .confirm-ok:hover { background: #a33025; }

  .tutorial-box { max-width: 480px; }
  .tutorial-image { background: var(--accent-tint); border-radius: 12px; padding: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
  .tutorial-caption { font-size: 14px; line-height: 1.8; color: #333; min-height: 70px; white-space: pre-line; }
  .tutorial-caption .note { display: block; margin-top: 8px; font-size: 11.5px; color: #999; line-height: 1.6; }
  .tutorial-dots { display: flex; justify-content: center; gap: 6px; margin: 16px 0; }
  .tutorial-dot { width: 7px; height: 7px; border-radius: 50%; background: #ddd; }
  .tutorial-dot.active { background: var(--accent); }
  .tutorial-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tutorial-nav button { border-radius: 8px; padding: 10px 18px; font-size: 13.5px; font-weight: 700; border: none; }
  .tutorial-back { background: #ececef; color: #555; }
  .tutorial-back:disabled { visibility: hidden; }
  .tutorial-next { background: var(--accent); color: white; }
</style>
</head>
<body>

<div class="layout">
  <div class="sidebar">
    <div class="logo-row">
      <div class="logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12a8 8 0 0 1 13-6"/><polyline points="17 2 17 6 13 6"/>
          <path d="M20 12a8 8 0 0 1-13 6"/><polyline points="7 22 7 18 11 18"/>
        </svg>
      </div>
      <div class="logo-text"><b>SKグループ</b><span>業界情報ポータル</span></div>
    </div>
    <div class="mode-toggle" id="modeToggle">
      <button data-mode="all">すべての情報をみる</button>
      <button data-mode="mine">カテゴリを絞ってみる</button>
    </div>
    <div class="cat-list" id="catList"></div>
    <div class="sidebar-footer">
      <button class="sidebar-footer-btn" id="helpFab">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 1 1 3.5 2.3c-.9.5-1.5 1-1.5 2"/><circle cx="12" cy="16.8" r="0.6" fill="currentColor" stroke="none"/></svg>
        使い方
      </button>
      <button class="sidebar-footer-btn" id="feedbackFab">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-1l-4.5 1 1-4.5a8.38 8.38 0 0 1-1-4A8.38 8.38 0 0 1 12.5 3a8.5 8.5 0 0 1 8.5 8.5z"/></svg>
        フィードバック
      </button>
      <button class="sidebar-footer-btn" id="changelogFab">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
        更新履歴
      </button>
    </div>
  </div>

  <div class="main">
    <div class="main-inner">
      <div class="search-row">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
          <input id="searchInput" type="text" placeholder="キーワードで検索(タイトル・要約)">
        </div>
      </div>
      <div class="status-line" id="statusLine">読み込み中...</div>
      <div id="feed"></div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="閉じる">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <span class="modal-kicker" id="modalKicker"></span>
    <h3 id="modalTitle"></h3>
    <p id="modalSummary"></p>
    <div class="modal-meta">
      <span id="modalMeta"></span>
      <a class="modal-source-link" id="modalSourceLink" href="#" target="_blank" rel="noopener">元記事を見る →</a>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="feedbackOverlay">
  <div class="modal-box">
    <button class="modal-close" id="feedbackClose" aria-label="閉じる">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3>使い勝手のフィードバック</h3>
    <form id="feedbackForm">
      <div class="form-field">
        <label for="fbDepartment">部署<span style="color:#c00">*</span></label>
        <input id="fbDepartment" type="text" required placeholder="例：SKトレーディング営業、SKホールディングス経営企画室 等">
      </div>
      <div class="form-field">
        <label for="fbName">名前<span style="color:#c00">*</span> <span class="field-hint">(フルネーム)</span></label>
        <input id="fbName" type="text" required placeholder="例: 山田太郎">
      </div>
      <div class="form-field">
        <label for="fbContent">内容<span style="color:#c00">*</span></label>
        <textarea id="fbContent" rows="4" required placeholder="使いにくい点、欲しい機能など何でもどうぞ"></textarea>
      </div>
      <button type="submit" class="form-submit">送信</button>
      <div class="form-note hidden" id="fbNote">送信しました。ありがとうございます。</div>
    </form>
    <div class="fb-list-head">みんなのフィードバック</div>
    <div id="fbList"></div>
  </div>
</div>

<div class="modal-overlay hidden" id="tutorialOverlay">
  <div class="modal-box tutorial-box">
    <button class="modal-close" id="tutorialClose" aria-label="閉じる">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3>使い方ガイド</h3>
    <div class="tutorial-image" id="tutorialImage"></div>
    <div class="tutorial-caption" id="tutorialCaption"></div>
    <div class="tutorial-dots" id="tutorialDots"></div>
    <div class="tutorial-nav">
      <button class="tutorial-back" id="tutorialBack">← 戻る</button>
      <button class="tutorial-next" id="tutorialNext">次へ →</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="changelogOverlay">
  <div class="modal-box">
    <button class="modal-close" id="changelogClose" aria-label="閉じる">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3>更新履歴</h3>
    <div id="changelogList"></div>
  </div>
</div>

<div class="modal-overlay hidden" id="confirmOverlay">
  <div class="modal-box confirm-box">
    <p id="confirmMessage"></p>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="confirmCancel">キャンセル</button>
      <button class="confirm-ok" id="confirmOk">削除する</button>
    </div>
  </div>
</div>

<script>
const CATEGORIES = ["行政・法改正","企業の取り組み","リサイクル","産廃・処理業","資源相場","AI・DX","海外","電子マニフェスト","行政処分","事件・事故","業界動向"];
const HUE = { "行政・法改正":250, "企業の取り組み":200, "リサイクル":165, "産廃・処理業":90, "資源相場":45, "AI・DX":290, "海外":320, "電子マニフェスト":230, "行政処分":15, "事件・事故":25, "業界動向":130 };

let allItems = [];
let activeCategory = null;
let viewMode = localStorage.getItem("skinfo_viewMode") || "all";
let myCategories = new Set(JSON.parse(localStorage.getItem("skinfo_myCategories") || "[]"));

function catColor(cat, kind) {
  const h = HUE[cat] ?? 250;
  if (kind === "bg") return `oklch(91% 0.05 ${h})`;
  if (kind === "text") return `oklch(38% 0.13 ${h})`;
  return `oklch(60% 0.14 ${h})`; // bar
}

function primaryCategory(item) {
  return (item.categories && item.categories[0]) || "業界動向";
}

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return `${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}

function escapeHtml(s) {
  return (s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ログイン機能はないため、ブラウザごとに持たせるランダムIDで「誰が反応したか」を区別する。
// これにより「不要」の集計が、同じ人の連打ではなく複数人の判断が揃ったかを見られるようにする。
function getClientId() {
  let id = localStorage.getItem("skinfo_clientId");
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("skinfo_clientId", id);
  }
  return id;
}

async function loadItems() {
  const res = await fetch("/api/items");
  allItems = await res.json();
  // 発表日(publishedAt)基準で新しい順に並べる。発表日が不明な記事は(収集日ではなく)末尾に回す。
  allItems.sort((a, b) => {
    const aTime = a.publishedAt ? new Date(a.publishedAt).getTime() : -Infinity;
    const bTime = b.publishedAt ? new Date(b.publishedAt).getTime() : -Infinity;
    return bTime - aTime;
  });
  renderSidebar();
  renderFeed();
}

function renderModeToggle() {
  document.querySelectorAll("#modeToggle button").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.mode === viewMode);
  });
}

function renderSidebar() {
  renderModeToggle();
  const counts = {};
  for (const item of allItems) {
    for (const c of item.categories || []) counts[c] = (counts[c] || 0) + 1;
  }
  const catList = document.getElementById("catList");

  if (viewMode === "mine") {
    const rows = [
      `<div class="my-cat-header"><span>表示するカテゴリ</span><span class="my-cat-count">${myCategories.size}件選択中</span></div>`
    ];
    for (const cat of CATEGORIES) {
      const checked = myCategories.has(cat);
      rows.push(`
        <div class="cat-check-row ${checked ? "checked" : ""}" data-cat="${cat}">
          <span class="checkbox ${checked ? "checked" : ""}">${checked ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ""}</span>
          <span>${cat}</span>
        </div>`);
    }
    catList.innerHTML = rows.join("");
    catList.querySelectorAll(".cat-check-row").forEach((row) => {
      row.addEventListener("click", () => {
        const cat = row.dataset.cat;
        if (myCategories.has(cat)) myCategories.delete(cat); else myCategories.add(cat);
        localStorage.setItem("skinfo_myCategories", JSON.stringify([...myCategories]));
        renderSidebar();
        renderFeed();
      });
    });
    return;
  }

  const rows = [`<button class="cat-row ${activeCategory === null ? "active" : ""}" data-cat="">すべて<span class="count">${allItems.length}</span></button>`];
  for (const cat of CATEGORIES) {
    rows.push(`<button class="cat-row ${activeCategory === cat ? "active" : ""}" data-cat="${cat}">${cat}<span class="count">${counts[cat] || 0}</span></button>`);
  }
  catList.innerHTML = rows.join("");
  catList.querySelectorAll(".cat-row").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.cat || null;
      renderSidebar();
      renderFeed();
    });
  });
}

function matchesFilters(item, query) {
  if (viewMode === "mine") {
    if (myCategories.size === 0) return false;
    if (!(item.categories || []).some((c) => myCategories.has(c))) return false;
  } else if (activeCategory && !(item.categories || []).includes(activeCategory)) {
    return false;
  }
  if (!query) return true;
  const haystack = `${item.title} ${item.summary}`.toLowerCase();
  return haystack.includes(query.toLowerCase());
}

function reactionCounts(item) {
  // 同じ人の連打で水増しされないよう、userId(ブラウザごとの簡易ID)の重複を除いて数える。
  const want = new Set((item.reactions || []).filter((r) => r.judgement === "want").map((r) => r.userId)).size;
  const notWant = new Set((item.reactions || []).filter((r) => r.judgement === "not_want").map((r) => r.userId)).size;
  return { want, notWant };
}

function reactionButtons(item) {
  const { want, notWant } = reactionCounts(item);
  return `
    <div class="actions">
      <button data-id="${item.id}" data-judgement="want" title="使える">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3z"/><path d="M7 11l3.5-7a2 2 0 0 1 2 2v4h5.5a2 2 0 0 1 1.9 2.6l-1.8 6A2 2 0 0 1 16.2 20H9a2 2 0 0 1-2-2"/></svg>
        <span class="reaction-count">${want}</span>
      </button>
      <button data-id="${item.id}" data-judgement="not_want" title="不要">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="transform:scaleY(-1)"><path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3z"/><path d="M7 11l3.5-7a2 2 0 0 1 2 2v4h5.5a2 2 0 0 1 1.9 2.6l-1.8 6A2 2 0 0 1 16.2 20H9a2 2 0 0 1-2-2"/></svg>
        <span class="reaction-count">${notWant}</span>
      </button>
    </div>`;
}

function renderFeed() {
  const query = document.getElementById("searchInput").value.trim();
  const filtered = allItems.filter((item) => matchesFilters(item, query));
  const modeLabel = viewMode === "mine" ? "絞り込み中" : (activeCategory ? "カテゴリ: " + activeCategory : "すべての情報");
  document.getElementById("statusLine").textContent = `${filtered.length}件 ／ ${modeLabel}`;

  const feed = document.getElementById("feed");
  if (filtered.length === 0) {
    const message = viewMode === "mine" && myCategories.size === 0
      ? "サイドバーでカテゴリを選択してください"
      : "該当する記事がありません";
    feed.innerHTML = `<div class="empty">${message}</div>`;
    return;
  }

  const hero = filtered[0];
  const pickups = filtered.slice(1, 7);
  const rest = filtered.slice(7);

  const heroCat = primaryCategory(hero);
  let html = `
    <div style="display:flex; flex-direction:column; gap:16px; margin-bottom:30px;">
      <div class="section-head"><span><span class="num">01</span><h2>注目</h2></span></div>
      <div class="hero">
        <div class="hero-icon" style="background:${catColor(heroCat, "bg")};">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="${catColor(heroCat, "text")}" stroke-width="1.6"><rect x="5" y="3" width="14" height="18" rx="1.5"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </div>
        <div class="hero-body">
          <span class="kicker" style="color:${catColor(heroCat, "text")}">${heroCat}</span>
          <div class="clickable" data-detail-id="${hero.id}">
            <h3>${escapeHtml(hero.title)}</h3>
            <p>${escapeHtml(hero.summary)}</p>
          </div>
          <div class="meta-row">
            <span class="meta-text">${escapeHtml(hero.sourceName)}${hero.isPrimarySource ? "・一次情報" : ""} ／ ${formatDate(hero.publishedAt) || "日付不明"}</span>
            <div class="actions">
              <a href="${hero.sourceUrl}" target="_blank" style="font-size:12.5px; font-weight:700;">元記事を見る →</a>
              ${reactionButtons(hero)}
            </div>
          </div>
        </div>
      </div>
    </div>`;

  if (pickups.length > 0) {
    html += `
    <div style="display:flex; flex-direction:column; gap:16px; margin-bottom:30px;">
      <div class="section-head"><span><span class="num">02</span><h2>ピックアップ</h2></span></div>
      <div class="pickup-grid">
        ${pickups.map((item) => {
          const cat = primaryCategory(item);
          return `
          <div class="pickup-card">
            <div class="pickup-strip" style="background:${catColor(cat, "bar")}"></div>
            <div class="pickup-body">
              <span class="kicker" style="font-size:11px; color:${catColor(cat, "text")}">${cat}</span>
              <div class="clickable" data-detail-id="${item.id}">
                <h4>${escapeHtml(item.title)}</h4>
                <p>${escapeHtml(item.summary)}</p>
              </div>
              <span style="font-size:11px; color:#999;">${escapeHtml(item.sourceName)} ／ ${formatDate(item.publishedAt) || "日付不明"}</span>
              <div class="pickup-foot">
                <a href="${item.sourceUrl}" target="_blank" style="font-weight:700;">元記事 →</a>
                ${reactionButtons(item)}
              </div>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }

  if (rest.length > 0) {
    html += `
    <div style="display:flex; flex-direction:column; gap:14px;">
      <div class="section-head"><span><span class="num">03</span><h2>新着一覧</h2></span></div>
      <div class="dense-list">
        ${rest.map((item) => {
          const cat = primaryCategory(item);
          return `
          <div class="news-row">
            <div class="news-bar" style="background:${catColor(cat, "bar")}"></div>
            <div class="news-main clickable" data-detail-id="${item.id}">
              <span class="news-cat" style="color:${catColor(cat, "text")}">${cat}</span>
              <p class="news-title">${escapeHtml(item.title)}</p>
              <p class="news-summary">${escapeHtml(item.summary)}</p>
              <div class="news-meta"><span>${escapeHtml(item.sourceName)}</span><span>${formatDate(item.publishedAt) || "日付不明"}</span></div>
            </div>
            <div class="news-side">${reactionButtons(item)}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }

  feed.innerHTML = html;

  feed.querySelectorAll("[data-detail-id]").forEach((el) => {
    el.addEventListener("click", () => openDetail(el.dataset.detailId));
  });

  feed.querySelectorAll("[data-judgement]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id;
      const judgement = btn.dataset.judgement;
      btn.style.color = "#4642A0";
      const res = await fetch(`/api/items/${id}/reaction`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ judgement, userId: getClientId() })
      });
      if (!res.ok) return;
      // 全体を再読込せず、その場でカウント表示だけ更新する。
      const item = allItems.find((i) => i.id === id);
      if (item) {
        item.reactions = [...(item.reactions || []), { userId: getClientId(), judgement, reactedAt: new Date().toISOString() }];
        const { want, notWant } = reactionCounts(item);
        document.querySelectorAll(`[data-id="${id}"][data-judgement="want"] .reaction-count`).forEach((el) => { el.textContent = want; });
        document.querySelectorAll(`[data-id="${id}"][data-judgement="not_want"] .reaction-count`).forEach((el) => { el.textContent = notWant; });
      }
    });
  });
}

function openDetail(id) {
  const item = allItems.find((i) => i.id === id);
  if (!item) return;
  const cat = primaryCategory(item);
  document.getElementById("modalKicker").textContent = cat;
  document.getElementById("modalKicker").style.color = catColor(cat, "text");
  document.getElementById("modalTitle").textContent = item.title;
  document.getElementById("modalSummary").textContent = item.summary;
  document.getElementById("modalMeta").textContent =
    `${item.sourceName}${item.isPrimarySource ? "・一次情報" : ""} ／ ${formatDate(item.publishedAt) || "日付不明"}`;
  document.getElementById("modalSourceLink").href = item.sourceUrl;
  document.getElementById("modalOverlay").classList.remove("hidden");
}

function closeDetail() {
  document.getElementById("modalOverlay").classList.add("hidden");
}

document.getElementById("modalClose").addEventListener("click", closeDetail);
document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "modalOverlay") closeDetail();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  closeDetail();
  document.getElementById("feedbackOverlay").classList.add("hidden");
  document.getElementById("tutorialOverlay").classList.add("hidden");
  document.getElementById("changelogOverlay").classList.add("hidden");
});

document.getElementById("searchInput").addEventListener("input", renderFeed);

document.querySelectorAll("#modeToggle button").forEach((btn) => {
  btn.addEventListener("click", () => {
    viewMode = btn.dataset.mode;
    localStorage.setItem("skinfo_viewMode", viewMode);
    renderSidebar();

});

const feedbackOverlay = document.getElementById("feedbackOverlay");
document.getElementById("feedbackFab").addEventListener("click", () => {
  feedbackOverlay.classList.remove("hidden");
  loadFeedbackList();
});
document.getElementById("feedbackClose").addEventListener("click", () => feedbackOverlay.classList.add("hidden"));
feedbackOverlay.addEventListener("click", (e) => { if (e.target === feedbackOverlay) feedbackOverlay.classList.add("hidden"); });

async function loadFeedbackList() {
  const list = document.getElementById("fbList");
  list.innerHTML = `<div class="fb-empty">読み込み中...</div>`;
  try {
    const res = await fetch("/api/feedback");
    const items = await res.json();
    renderFeedbackList(items);
  } catch {
    list.innerHTML = `<div class="fb-empty">読み込みに失敗しました</div>`;
  }
}

let openReplyFormFor = null; // どのfeedback項目の「返信する」フォームを開いているか
let editingFeedbackId = null;
let editingReply = null; // { feedbackId, replyId }

function editFormHtml(prefix, values) {
  return `
    <input type="text" class="${prefix}-dept" placeholder="部署" maxlength="100" value="${escapeHtml(values.department || "")}">
    <input type="text" class="${prefix}-name" placeholder="名前" maxlength="100" value="${escapeHtml(values.name || "")}">
    <textarea class="${prefix}-content" rows="2" placeholder="内容" maxlength="1000">${escapeHtml(values.content || "")}</textarea>
    <button type="submit">保存</button>
    <button type="button" class="fb-cancel">キャンセル</button>`;
}

function renderFeedbackList(items) {
  const list = document.getElementById("fbList");
  if (items.length === 0) {
    list.innerHTML = `<div class="fb-empty">まだ投稿がありません</div>`;
    return;
  }

  list.innerHTML = items.map((item) => {
    const who = [item.department, item.name].filter(Boolean).join(" / ") || "匿名";

    const bodyHtml = editingFeedbackId === item.id
      ? `<form class="fb-edit-form" data-edit-feedback-id="${item.id}">${editFormHtml("e", item)}</form>`
      : `
        <div class="fb-item-meta">
          <span>${escapeHtml(who)} ・ ${formatDate(item.createdAt)}</span>
          <span class="fb-actions">
            <button type="button" class="fb-action-btn" data-edit-feedback="${item.id}">編集</button>
            <button type="button" class="fb-action-btn danger" data-delete-feedback="${item.id}">削除</button>
          </span>
        </div>
        <div class="fb-item-content">${escapeHtml(item.content)}</div>`;

    const repliesHtml = (item.replies || []).map((r) => {
      const who2 = [r.department, r.name].filter(Boolean).join(" / ") || "担当者";
      if (r.id && editingReply && editingReply.feedbackId === item.id && editingReply.replyId === r.id) {
        return `<form class="fb-edit-form" data-edit-feedback-id="${item.id}" data-edit-reply-id="${r.id}">${editFormHtml("e", r)}</form>`;
      }
      return `
        <div class="fb-reply">
          <div class="fb-reply-meta">
            <span>${escapeHtml(who2)} ・ ${formatDate(r.createdAt)}</span>
            ${r.id ? `
            <span class="fb-actions">
              <button type="button" class="fb-action-btn" data-edit-reply="${r.id}" data-edit-reply-feedback="${item.id}">編集</button>
              <button type="button" class="fb-action-btn danger" data-delete-reply="${r.id}" data-delete-reply-feedback="${item.id}">削除</button>
            </span>` : ""}
          </div>
          <div class="fb-reply-content">${escapeHtml(r.content)}</div>
        </div>`;
    }).join("");

    const replyFormHtml = openReplyFormFor === item.id
      ? `<form class="fb-reply-form" data-reply-id="${item.id}">${editFormHtml("r", {})}</form>`.replace("保存", "返信")
      : `<button type="button" class="fb-reply-toggle" data-open-reply="${item.id}">返信する</button>`;

    return `<div class="fb-item">${bodyHtml}${repliesHtml}${replyFormHtml}</div>`;
  }).join("");

  // 返信フォームを開く
  list.querySelectorAll("[data-open-reply]").forEach((btn) => {
    btn.addEventListener("click", () => {
      openReplyFormFor = btn.dataset.openReply;
      renderFeedbackList(items);
    });
  });

  // 返信フォーム送信
  list.querySelectorAll(".fb-reply-form").forEach((form) => {
    form.querySelector(".fb-cancel")?.addEventListener("click", () => {
      openReplyFormFor = null;
      renderFeedbackList(items);
    });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const department = form.querySelector(".r-dept").value.trim();
      const name = form.querySelector(".r-name").value.trim();
      const content = form.querySelector(".r-content").value.trim();
      if (!content) return;
      try {
        const res = await fetch(`/api/feedback/${form.dataset.replyId}/reply`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ department, name, content })
        });
        if (!res.ok) throw new Error((await res.json()).error || "返信に失敗しました");
        openReplyFormFor = null;
        await loadFeedbackList();
      } catch (err) {
        alert(`返信に失敗しました: ${err.message}`);
      }
    });
  });

  // フィードバック本体の編集・削除
  list.querySelectorAll("[data-edit-feedback]").forEach((btn) => {
    btn.addEventListener("click", () => {
      editingFeedbackId = btn.dataset.editFeedback;
      renderFeedbackList(items);
    });
  });
  list.querySelectorAll("[data-delete-feedback]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!(await showConfirm("本当によろしいですか？"))) return;
      try {
        const res = await fetch(`/api/feedback/${btn.dataset.deleteFeedback}`, { method: "DELETE" });
        if (!res.ok) throw new Error((await res.json()).error || "削除に失敗しました");
        await loadFeedbackList();
      } catch (err) {
        alert(`削除に失敗しました: ${err.message}`);
      }
    });
  });

  // 返信の編集・削除
  list.querySelectorAll("[data-edit-reply]").forEach((btn) => {
    btn.addEventListener("click", () => {
      editingReply = { feedbackId: btn.dataset.editReplyFeedback, replyId: btn.dataset.editReply };
      renderFeedbackList(items);
    });
  });
  list.querySelectorAll("[data-delete-reply]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!(await showConfirm("本当によろしいですか？"))) return;
      try {
        const res = await fetch(`/api/feedback/${btn.dataset.deleteReplyFeedback}/reply/${btn.dataset.deleteReply}`, {
          method: "DELETE"
        });
        if (!res.ok) throw new Error((await res.json()).error || "削除に失敗しました");
        await loadFeedbackList();
      } catch (err) {
        alert(`削除に失敗しました: ${err.message}`);
      }
    });
  });

  // 編集フォーム(フィードバック本体・返信 共通)の保存・キャンセル
  list.querySelectorAll(".fb-edit-form").forEach((form) => {
    form.querySelector(".fb-cancel").addEventListener("click", () => {
      editingFeedbackId = null;
      editingReply = null;
      renderFeedbackList(items);
    });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const department = form.querySelector(".e-dept").value.trim();
      const name = form.querySelector(".e-name").value.trim();
      const content = form.querySelector(".e-content").value.trim();
      const feedbackId = form.dataset.editFeedbackId;
      const replyId = form.dataset.editReplyId;
      const url = replyId ? `/api/feedback/${feedbackId}/reply/${replyId}` : `/api/feedback/${feedbackId}`;
      try {
        const res = await fetch(url, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ department, name, content })
        });
        if (!res.ok) throw new Error((await res.json()).error || "更新に失敗しました");
        editingFeedbackId = null;
        editingReply = null;
        await loadFeedbackList();
      } catch (err) {
        alert(`更新に失敗しました: ${err.message}`);
      }
    });
  });
}

document.getElementById("feedbackForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const department = document.getElementById("fbDepartment").value.trim();
  const name = document.getElementById("fbName").value.trim();
  const content = document.getElementById("fbContent").value.trim();
  const note = document.getElementById("fbNote");
  const submitBtn = e.target.querySelector(".form-submit");
  submitBtn.disabled = true;
  try {
    const res = await fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ department, name, content })
    });
    if (!res.ok) throw new Error((await res.json()).error || "送信に失敗しました");
    note.textContent = "送信しました。ありがとうございます。";

    document.getElementById("fbContent").value = "";
    await loadFeedbackList();
  } catch (err) {
    note.textContent = `送信に失敗しました: ${err.message}`;
    note.classList.remove("hidden");
  } finally {
    submitBtn.disabled = false;
  }
});

let tutorialStep = 0;

function renderTutorialStep() {
  const step = TUTORIAL_STEPS[tutorialStep];
  document.getElementById("tutorialImage").innerHTML = step.svg;
  document.getElementById("tutorialCaption").innerHTML =
    escapeHtml(step.caption) + (step.note ? `<span class="note">${escapeHtml(step.note)}</span>` : "");
  document.getElementById("tutorialDots").innerHTML = TUTORIAL_STEPS.map((_, i) =>
    `<span class="tutorial-dot ${i === tutorialStep ? "active" : ""}"></span>`
  ).join("");
  document.getElementById("tutorialBack").disabled = tutorialStep === 0;
  document.getElementById("tutorialNext").textContent = tutorialStep === TUTORIAL_STEPS.length - 1 ? "終了" : "次へ →";
}

const tutorialOverlay = document.getElementById("tutorialOverlay");
document.getElementById("helpFab").addEventListener("click", () => {
  tutorialStep = 0;
  renderTutorialStep();
  tutorialOverlay.classList.remove("hidden");
});
document.getElementById("tutorialClose").addEventListener("click", () => tutorialOverlay.classList.add("hidden"));
tutorialOverlay.addEventListener("click", (e) => { if (e.target === tutorialOverlay) tutorialOverlay.classList.add("hidden"); });
document.getElementById("tutorialBack").addEventListener("click", () => {
  if (tutorialStep > 0) { tutorialStep--; renderTutorialStep(); }
});
document.getElementById("tutorialNext").addEventListener("click", () => {
  if (tutorialStep < TUTORIAL_STEPS.length - 1) { tutorialStep++; renderTutorialStep(); }
  else tutorialOverlay.classList.add("hidden");
});

// --- 確認ダイアログ(ブラウザ標準confirm()はURLが表示されて分かりにくいため自前で用意) ---
const confirmOverlay = document.getElementById("confirmOverlay");
function showConfirm(message) {
  document.getElementById("confirmMessage").textContent = message;
  confirmOverlay.classList.remove("hidden");
  return new Promise((resolve) => {
    const okBtn = document.getElementById("confirmOk");
    const cancelBtn = document.getElementById("confirmCancel");
    const cleanup = (result) => {
      confirmOverlay.classList.add("hidden");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      confirmOverlay.removeEventListener("click", onOverlay);
      resolve(result);
    };
    const onOk = () => cleanup(true);
    const onCancel = () => cleanup(false);
    const onOverlay = (e) => { if (e.target === confirmOverlay) cleanup(false); };
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    confirmOverlay.addEventListener("click", onOverlay);
  });
}
